[package]
name = "rapid-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
mail-parser = { version = "1.0.0", features = ["full_encoding"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
display = []

[dev-dependencies]
insta = { version = "1.49.0", features = ["json", "glob"] }
